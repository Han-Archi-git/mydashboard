<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>mydashboard</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <header class="topbar">
    <a href="#/" class="logo" data-link>mydashboard</a>
    <nav class="crumbs" id="crumbs"></nav>
    <div class="topbar-right">
      <span id="live-clock" class="live-clock" aria-live="off">
        <span class="date" id="lc-date"></span>
        <span class="time" id="lc-time"></span>
      </span>
      <span id="sync-status" class="sync-status" title="동기화 상태">●</span>
      <button id="settings-btn" class="icon-btn" aria-label="설정">설정</button>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
